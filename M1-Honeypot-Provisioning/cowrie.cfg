# ==============================================================================
# Cowrie SSH Honeypot Hardened Configuration
# Deployment Profile: Target-Deception (Ubuntu Server 22.04 LTS / 10.0.0.5)
# Engagement ID: IR-2026-1031-01
# Emulated Profile: Debian 12 (Bookworm) OpenSSH 9.2p1
# ==============================================================================

[honeypot]
# Virtual hostname and domain presented in emulated shell
hostname = debian-srv-01
domain = internal.corp.local

# Path to fake POSIX filesystem and pickle data
filesystem = var/lib/cowrie/fs.pickle
txtcmds_path = share/cowrie/txtcmds

# Interactive shell timeout (seconds)
interactive_timeout = 180
authentication_timeout = 60

# Emulated architecture and kernel release
arch = linux-x64-lsb
kernel_version = 6.1.0-18-amd64
kernel_build = #1 SMP PREEMPT_DYNAMIC Debian 6.1.76-1 (2024-02-01)

# Fake operating system prompt
prompt = root@debian-srv-01:~# 

# Download limitations to mitigate denial of service
download_limit_size = 10485760
download_total_size = 52428800

[ssh]
# Enable SSH service emulation
enabled = true

# Non-standard listening port to isolate host administrative access on 22
listen_endpoints = tcp:2222:interface=0.0.0.0

# Banner matching OpenSSH 9.2p1 Debian 2+deb12u3
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3

# Cryptographic host keys (custom generated to prevent Shodan fingerprinting)
rsa_key = etc/ssh_host_rsa_key
ecdsa_key = etc/ssh_host_ecdsa_key
ed25519_key = etc/ssh_host_ed25519_key

# SSH Key Exchange and Cipher Suite Configuration
kex_algorithms = curve25519-sha256,ecdh-sha2-nistp256,diffie-hellman-group14-sha256
ciphers = chacha20-poly1305@openssh.com,aes128-ctr,aes256-gcm@openssh.com
macs = hmac-sha2-256,hmac-sha2-512

# Interactive session recording
pty_support = true

[telnet]
# Disable Telnet to mirror targeted SSH attack surface
enabled = false

[output_jsonlog]
# Structured machine-readable incident telemetry
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamps = false

[output_textlog]
# Human-readable flat text logging
enabled = true
logfile = var/log/cowrie/cowrie.log
format = %(asctime)s [%(name)s,%(session)s,%(remote_ip)s] %(message)s
